<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CallMind CRM by Voolabs — SIM Telecalling Platform</title>
    <meta name="description" content="CallMind CRM is a product of Voolabs Technologies. India's best SIM telecalling and lead management platform with multi-source webhooks and zero audio storage." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Single font request for the whole app.
         Previously the fonts were requested TWICE: this link (8 weights, and
         missing JetBrains Mono despite ~100 font-mono usages) plus an @import
         at the top of src/index.css (20 weights). The @import was the worse of
         the two — a CSS @import is only discovered after index.css downloads
         and parses, so it blocked render serially. This link is found during
         the initial HTML parse. Weights here match what index.css requested,
         minus Inter 300 which nothing uses. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://callmind.app" />
    <meta property="og:title" content="CallMind CRM by Voolabs — SIM Telecalling Platform" />
    <meta property="og:description" content="CallMind CRM by Voolabs Technologies. India's best SIM telecalling and lead management platform." />
    <meta property="og:image" content="https://callmind.app/og-image.jpg" />

    <!-- Twitter -->

    <meta property="twitter:title" content="CallMind CRM by Voolabs — SIM Telecalling Platform" />
    <meta property="twitter:description" content="CallMind CRM by Voolabs Technologies. India's best SIM telecalling and lead management platform." />
    <meta property="twitter:image" content="https://callmind.app/og-image.jpg" />
